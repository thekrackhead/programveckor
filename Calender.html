<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Calender</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        #calendar {
            max-width: 900px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
  <section id="sec1">
      <div class="dropdown">
        <button class="dropbtn" onclick="coolFunction()">Menu
          <i class="fa fa-caret-down"></i>
        </button>
        <div class="dropdown-content" id="coolDropdown">
          <a href="index.html">homepage</a>
          <a href="subjects.html">subjects</a>
          <a href="grades.html">grades</a>
          <a href="#">calender</a>
        </div>
      </div>
        <h1>Calender</h1>
    </section>
    <div id='calendar'></div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
      
        const calendarEl = document.getElementById('calendar');
      
        // Hämtar sparade events
        const storedEvents = JSON.parse(localStorage.getItem('calendarEvents')) || [];
      
        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          selectable: true,
          editable: true,
      
          // Laddar events från localStorage
          events: storedEvents.map(e => ({
            title: `${e.subject} – ${e.testType}`,
            start: e.date,
            allDay: true
          })),
      
          // Lägger till event
          select: function(info) {
            const subject = prompt('Subject:');
            if (!subject) return calendar.unselect();
      
            const testType = prompt('Task type exam, submission etc:');
            if (!testType) return calendar.unselect();
      
            const eventData = {
              subject: subject,
              testType: testType,
              date: info.startStr
            };
      
            // Sparar i localStorage
            storedEvents.push(eventData);
            localStorage.setItem('calendarEvents', JSON.stringify(storedEvents));
      
            calendar.addEvent({
              title: `${subject} – ${testType}`,
              start: info.startStr,
              allDay: info.allDay
            });
      
            calendar.unselect();
          },
      
          //  Ta bort event
          eventClick: function(info) {
            if (confirm(`Remove "${info.event.title}"?`)) {
      
              info.event.remove();
      
              // Ta bort från localStorage
              const updatedEvents = storedEvents.filter(e => {
                const title = `${e.subject} – ${e.testType}`;
                return !(title === info.event.title && e.date === info.event.startStr);
              });
      
              // Uppdatera localStorage
              localStorage.setItem('calendarEvents', JSON.stringify(updatedEvents));
      
              storedEvents.length = 0;
              storedEvents.push(...updatedEvents);
            }
          },
      
          eventDrop: function(info) {
            const updatedEvents = storedEvents.map(e => {
              const title = `${e.subject} – ${e.testType}`;
              if (title === info.event.title && e.date === info.oldEvent.startStr) {
                // Uppdatera datum till nya datumet
                return { ...e, date: info.event.startStr };
              }
              return e;
            });
      
            // Spara tillbaka i localStorage
            localStorage.setItem('calendarEvents', JSON.stringify(updatedEvents));
      
            storedEvents.length = 0;
            storedEvents.push(...updatedEvents);
          }
      
        });
      
        calendar.render();
      });

      function coolFunction() {
      document.getElementById("coolDropdown").classList.toggle("show");
    }

    window.onclick = function(e) {
      if (!e.target.matches('.dropbtn')) {
        var coolDropdown = document.getElementById("coolDropdown");
        if (coolDropdown.classList.contains('show')) {
          coolDropdown.classList.remove('show');
        }
      }
    }
      </script>
      
      
    
</body>
</html>
