<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calender.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Calender</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
</head>
<body>
  <section id="sec1">
  <h1>Welcome!</h1>
  </section>


  <a class="back1"href="index.html">
    <img src="lines.png" class="lines" width="45">
  </a>

  <a class="back2" href="Calender.html">
    <img src="calendaricon.png" class="calendaricon" width="40">
  </a>


  <a href="account.html">
    <img src="account.png" class="accounticon" width="40">
  </a>


  <div class="calendar-wrapper">
    <div id='calendar'></div>
  </div>
  

  
  
  <div class="back"></div>
    <img src="hamburger.png" class="hamburger" width="40" height="40" onclick="toggleMenu()">
    <img src="x.png" class="x" id="x" width="20" height="20" onclick="closeDropdown()">
    <div id="dropdown" class="dropdown">
      <h2>Menu</h2>
      <a href="index.html">Home</a>
      <a href="grades.html">Grades</a>
      <a href="#">Calender</a>
  
      <div class="studytips">
        <span id="nestedLabel" onclick="toggleNested()" class="label">StudyTips▸</span>
        <div id="study-dropdown" class="study-dropdown">
          <p>pain</p>
          <p>in</p>
          <p>my</p>
          <p>dih</p>
        </div>
      </div>
  
    </div>
  
    
    <script>
  
  const dropdown = document.getElementById("dropdown");
      const xBtn = document.getElementById("x");
      const nested = document.getElementById("study-dropdown");
      const nestedLabel = document.getElementById("nestedLabel");
  
      dropdown.style.display = "none";
      xBtn.style.display = "none";
      nested.style.display = "none";
  
      function toggleMenu() {
        const isVisible = dropdown.style.display === "block";
        dropdown.style.display = isVisible ? "none" : "block";
        xBtn.style.display = isVisible ? "none" : "block";
  
        if (isVisible) nested.style.display = "none";
        if (isVisible) nestedLabel.innerHTML = "StudyTips▸";
      }
  
      function toggleNested() {
        const isVisible = nested.style.display === "block";
        nested.style.display = isVisible ? "none" : "block";
        nestedLabel.innerHTML = isVisible ? "StudyTips▸" : "StudyTips▾";
      }
  
      function closeDropdown() {
        dropdown.style.display = "none";
        xBtn.style.display = "none";
        nested.style.display = "none";
        nestedLabel.innerHTML = "StudyTips▸";
      }
  
    </script>

<script>
document.addEventListener('DOMContentLoaded', function () {

const calendarEl = document.getElementById('calendar');
if (!calendarEl) {
  console.error('Calendar element not found');
  return;
}

const storedEvents = JSON.parse(localStorage.getItem('calendarEvents')) || [];

// Give old events an id if they don't have one yet (migration)
let changed = false;
storedEvents.forEach(e => {
  if (!e.id) {
    e.id = (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
    changed = true;
  }
});
if (changed) {
  localStorage.setItem('calendarEvents', JSON.stringify(storedEvents));
}

const calendar = new FullCalendar.Calendar(calendarEl, {
  initialView: 'dayGridMonth',
  selectable: true,
  editable: true,

  headerToolbar: {
    left: 'prev,next',
    center: 'title',
    right: ''
  },

  events: storedEvents.map(e => ({
    id: e.id,
    title: `${e.subject} – ${e.testType}`,
    start: e.date,
    allDay: true
  })),

  select(info) {
    const subject = prompt('Subject:');
    if (!subject) return calendar.unselect();

    const testType = prompt('Task type:');
    if (!testType) return calendar.unselect();

    const eventId = (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

    const eventData = {
      id: eventId,
      subject,
      testType,
      date: info.startStr
    };

    storedEvents.push(eventData);
    localStorage.setItem('calendarEvents', JSON.stringify(storedEvents));

    calendar.addEvent({
      id: eventId,
      title: `${subject} – ${testType}`,
      start: info.startStr,
      allDay: true
    });

    calendar.unselect();
  },

  eventClick(info) {
    if (!confirm(`Remove "${info.event.title}"?`)) return;

    const eventId = info.event.id;

    info.event.remove();

    const updatedEvents = storedEvents.filter(e => e.id !== eventId);
    localStorage.setItem('calendarEvents', JSON.stringify(updatedEvents));
    storedEvents.length = 0;
    storedEvents.push(...updatedEvents);

    const grades = JSON.parse(localStorage.getItem('grades')) || [];
    const updatedGrades = grades.filter(g => g.eventId !== eventId);
    localStorage.setItem('grades', JSON.stringify(updatedGrades));
    localStorage.setItem('grades', JSON.stringify(grades.filter(g => g.eventId !== eventId)));
  },

  eventDrop(info) {
    const eventId = info.event.id;

    const updatedEvents = storedEvents.map(e => {
      if (e.id === eventId) {
        return { ...e, date: info.event.startStr };
      }
      return e;
    });

    localStorage.setItem('calendarEvents', JSON.stringify(updatedEvents));
    storedEvents.length = 0;
    storedEvents.push(...updatedEvents);
  }

});

calendar.render();
});


</script>


      
      
    
</body>
</html>
