<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Startmenustyle.css">
  <title>Document</title>
</head>
<body>
  <section id="sec1">
    <h1>Events</h1>
  </section>
  <div class="back">
    <img src="hamburger.png" class="hamburger" width="40" height="40" onclick="toggleMenu()" alt="burger">
    <img src="x.png" class="x" id="x" width="20" height="20" onclick="closeDropdown()" alt="close">
    <div id="dropdown" class="dropdown">
      <h2>Menu</h2>
      <a href="#">Home</a>
      <a href="grades.html">Grades</a>
      <a href="Calender.html">Calender</a>
  
      <div class="studytips">
        <span id="nestedLabel" onclick="toggleNested()" class="label">StudyTips▸</span>
        <div id="study-dropdown" class="study-dropdown">
          <p>pain</p>
          <p>in</p>
          <p>my</p>
          <p>dih</p>
        </div>
      </div>
  
    </div>
  </div>

  <section id="backgroundlayer0"></section>
  <section id="background"></section>
  <section id="DeadlineBackground"></section>

  <button class="button-18" onclick="window.location.href='Calender.html'">
    + Add
  </button>


  <h1 id="Passed_Due">Passed Due</h1>
  <h1 id="Upcoming">Upcoming</h1>
  

  <script>
    const storedEvents = JSON.parse(localStorage.getItem('calendarEvents')) || [];
  
    const upcomingContainer = document.getElementById('background');
    const passedContainer = document.getElementById('DeadlineBackground');
  
    const maxUpcoming = 7;
    const maxPassed = 6;
  
    const today = new Date();
    today.setHours(0, 0, 0, 0);
  
    // Sortera events efter datum (tidigast först)
    storedEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
  
    let upcomingIndex = 0;
    let passedIndex = 0;
  
    storedEvents.forEach(event => {
      const eventDate = new Date(event.date);
      eventDate.setHours(0, 0, 0, 0);
  
      const eventDiv = document.createElement('section');
      eventDiv.classList.add('event-template');
  
      // Lägg till Subject, TaskType och Date till event-template
      eventDiv.innerHTML = `
        <h1 class="Subject">${event.subject}</h1>
        <h1 class="TaskType">${event.testType}</h1>
        <h1 class="Date">${event.date}</h1>
      `;
  
      // Sätt färg på TaskType baserat på typen
      const taskTypeElement = eventDiv.querySelector('.TaskType');
      const type = event.testType.toLowerCase();
  
      if (type === 'exam' || type === 'test') {
        taskTypeElement.style.backgroundColor = 'rgba(219, 110, 255, 1)';
      } else if (type === 'submission') {
        taskTypeElement.style.backgroundColor = 'rgb(255, 230, 0)';
      } else if (type === 'homework') {
        taskTypeElement.style.backgroundColor = 'rgba(127, 219, 124, 1)';
      } else {
        taskTypeElement.style.backgroundColor = 'lightgray';
      }
  
      // Avgör om eventet är Passed Due eller Upcoming
      if (eventDate < today && passedIndex < maxPassed) {
        passedIndex++;
        eventDiv.style.gridRow = passedIndex;
  
        // Log knapp
        const logButton = document.createElement('button');
        logButton.classList.add('button-log');
        logButton.textContent = 'Log';
        eventDiv.appendChild(logButton);
  
        passedContainer.appendChild(eventDiv);
      } else if (eventDate >= today && upcomingIndex < maxUpcoming) {
        upcomingIndex++;
        eventDiv.style.gridRow = upcomingIndex;
        upcomingContainer.appendChild(eventDiv);
      }
    });
    const dropdown = document.getElementById("dropdown");
    const xBtn = document.getElementById("x");
    const nested = document.getElementById("study-dropdown");
    const nestedLabel = document.getElementById("nestedLabel");

    dropdown.style.display = "none";
    xBtn.style.display = "none";
    nested.style.display = "none";

    function toggleMenu() {
      const isVisible = dropdown.style.display === "block";
      dropdown.style.display = isVisible ? "none" : "block";
      xBtn.style.display = isVisible ? "none" : "block";

      if (isVisible) nested.style.display = "none";
      if (isVisible) nestedLabel.innerHTML = "StudyTips▸";
    }

    function toggleNested() {
      const isVisible = nested.style.display === "block";
      nested.style.display = isVisible ? "none" : "block";
      nestedLabel.innerHTML = isVisible ? "StudyTips▸" : "StudyTips▾";
    }

    function closeDropdown() {
      dropdown.style.display = "none";
      xBtn.style.display = "none";
      nested.style.display = "none";
      nestedLabel.innerHTML = "StudyTips▸";
    }
  </script>
  

</body>
</html>
