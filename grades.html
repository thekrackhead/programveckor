<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Startmenustyle.css">
  <title>grades</title>
</head>
<body>

  <section id="sec1">
    <h1>Grades</h1>
  </section>

  <a href="#">
    <img src="account.png" class="accounticon" width="40">
  </a>
  
  <div class="back">
    <img src="hamburger.png" class="hamburger" width="40" height="40" onclick="toggleMenu()" alt="burger">
    <img src="x.png" class="x" id="x" width="20" height="20" onclick="closeDropdown()" alt="close">
    <div id="dropdown" class="dropdown">
      <h2>Menu</h2>
      <a href="index.html">Home</a>
      <a href="#">Grades</a>
      <a href="Calender.html">Calender</a>
  
      <div class="studytips">
        <span id="nestedLabel" onclick="toggleNested()" class="label">StudyTips▸</span>
        <div id="study-dropdown" class="study-dropdown">
          <a class="learn" href="https://learningcenter.unc.edu/tips-and-tools/studying-101-study-smarter-not-harder/">learn</a>
        </div>
      </div>
  
    </div>
  </div>

  <div class="grades-page">
    <div class="grades-card">
      <div class="grades-header">
        <div>Subject</div>
        <div>Grade</div>
        <div>Goal</div>
        <div>Estimate</div>
        <div></div>
      </div>
  
      <div id="gradesRows" class="grades-rows"></div>
  
      <div class="grades-footer">
        <div>Merit</div>
        <div><span id="meritNow" class="merit-pill">0</span></div>
        <div><span id="meritGoal" class="merit-pill">0</span></div>
        <div><span id="meritEst" class="merit-pill">0</span></div>
        <div></div>
      </div>
    </div>
  </div>


  <div id="gradesList"></div>

    
  </div>
  
  
    
<script>  


  const dropdown = document.getElementById("dropdown");
  const xBtn = document.getElementById("x");
  const nested = document.getElementById("study-dropdown");
  const nestedLabel = document.getElementById("nestedLabel");
  
  dropdown.style.display = "none";
  xBtn.style.display = "none";
  nested.style.display = "none";
  
  function toggleMenu() {
    const isVisible = dropdown.style.display === "block";
    dropdown.style.display = isVisible ? "none" : "block";
    xBtn.style.display = isVisible ? "none" : "block";
  
    if (isVisible) nested.style.display = "none";
    if (isVisible) nestedLabel.innerHTML = "StudyTips▸";
  }
  
  function toggleNested() {
    const isVisible = nested.style.display === "block";
    nested.style.display = isVisible ? "none" : "block";
    nestedLabel.innerHTML = isVisible ? "StudyTips▸" : "StudyTips▾";
  }
  
  function closeDropdown() {
    dropdown.style.display = "none";
    xBtn.style.display = "none";
    nested.style.display = "none";
    nestedLabel.innerHTML = "StudyTips▸";
  }
  
</script>

<script>
  const grades = JSON.parse(localStorage.getItem('grades')) || [];
  const rowsEl = document.getElementById('gradesRows');
  const events = JSON.parse(localStorage.getItem('calendarEvents')) || [];

  const existingIds = new Set(events.map(e => e.id));
  const cleanedGrades = grades.filter(g => g.eventId && existingIds.has(g.eventId));
  localStorage.setItem('grades', JSON.stringify(cleanedGrades));

  const gradesData = cleanedGrades;

  const subjects = ["MA", "EN", "SV", "HI"];

  function latestFor(subject) {
    const filtered = gradesData.filter(g => g.subject === subject);
    if (!filtered.length) return null;
    filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
    return filtered[0];
  }

  // --- Helpers ---
  function percentToGrade(p) {
    if (p >= 90) return "A";
    if (p >= 80) return "B";
    if (p >= 70) return "C";
    if (p >= 60) return "D";
    if (p >= 50) return "E";
    return "F";
  }

  // --- Graph rendering into a container ---
  function renderGraphForSubject(subject, container) {
    const barsEl = container.querySelector('.bars');
    const avgLineEl = container.querySelector('.avg-line');
    const avgPercentEl = container.querySelector('#avgPercent');
    const avgGradeEl = container.querySelector('#avgGrade');
    const editBtn = container.querySelector('#editScoresBtn');

    const tests = gradesData
      .filter(g => g.subject === subject)
      .slice()
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    barsEl.innerHTML = "";

    if (tests.length === 0) {
      avgPercentEl.textContent = "0%";
      avgGradeEl.textContent = "F";
      avgLineEl.style.top = "100%";
      return;
    }

    const percents = tests.map(t => Number(t.percent) || 0);
    const avg = percents.reduce((s,v) => s + v, 0) / percents.length;

    avgPercentEl.textContent = `${Math.round(avg)}%`;
    avgGradeEl.textContent = percentToGrade(avg);

    avgLineEl.style.top = `${100 - Math.max(1, Math.min(100, avg))}%`;

    percents.forEach(p => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = `${Math.max(1, Math.min(100, p))}%`;
      barsEl.appendChild(bar);
    });

    if (editBtn) {
      editBtn.onclick = () => alert(`Edit test scores for ${subject}`);
    }
  }

  // Creates the details element (your popup content)
  function createDetailsRow() {
    const el = document.createElement('div');
    el.className = 'grade-details';

    el.innerHTML = `
      <div class="graph-popup">
        <h2 class="graph-title">Test Graph</h2>

        <div class="graph-layout">
          <div class="chart-wrap">
            <p class="a">10</p>
            <p class="b">20</p>
            <p class="c">30</p>
            <p class="d">40</p>
            <p class="e">50</p>
            <p class="f">60</p>
            <p class="g">70</p>
            <p class="h">80</p>
            <p class="i">90</p>
            <p class="j">100</p>
            <img src="procenticon.png" class="procenticon">
            <img src="procentlinje.png" class="graph-scale s-ma hidden">
            <img src="procentlinje.png" class="graph-scale s-en hidden">
            <img src="procentlinje.png" class="graph-scale s-sv hidden">
            <img src="procentlinje.png" class="graph-scale s-hi hidden">

            <div class="chart">
              <div class="avg-line"></div>
              <div class="bars"></div>
            </div>
          </div>

          <div class="graph-side">
            <p class="avg-label">Percentage Average</p>
            <div class="avg-box">
              <span id="avgPercent">0%</span>
              <span>=</span>
              <span class="avg-grade" id="avgGrade">F</span>
            </div>

          </div>
        </div>
      </div>
    `;

    return el;
  }

  function toggleDetails(rowEl, subject) {
  const existing = rowEl.nextElementSibling;

  // stäng
  if (existing && existing.classList.contains('grade-details')) {
    existing.remove();
    rowEl.classList.remove('active'); // ✅ badges tillbaka
    return;
  }

  // öppna
  const details = createDetailsRow();
  rowEl.insertAdjacentElement('afterend', details);

  rowEl.classList.add('active'); // ✅ badges bort på denna row

  // show correct scale
  details.querySelectorAll('.graph-scale').forEach(img => img.classList.add('hidden'));
  const key = subject.toLowerCase();
  details.querySelector(`.s-${key}`)?.classList.remove('hidden');

  renderGraphForSubject(subject, details);
}

  // --- Render rows ---
  rowsEl.innerHTML = "";

  subjects.forEach(sub => {
    const g = latestFor(sub);

    const gradeLetter = g ? g.grade : "—";
    const percent = g ? Number(g.percent) : 0;

    const goal = "A";
    const estimate = gradeLetter === "—" ? "—" : gradeLetter;

    const row = document.createElement('div');
    row.className = 'grade-row';
    row.innerHTML = `
      <div class="subject">${sub}</div>

      <div><span class="badge ${gradeLetter}">${gradeLetter}</span></div>

      <div><span class="badge ${goal}">${goal}</span></div>

      <div style="display:flex; align-items:center; gap:14px;">
        <span class="badge ${estimate}">${estimate}</span>
        <div class="progress">
          <span style="width:${Math.max(10, Math.min(95, percent))}%;"></span>
        </div>
      </div>
    `;

    row.style.cursor = 'pointer';
    row.addEventListener('click', () => toggleDetails(row, sub));

    rowsEl.appendChild(row);
  });

  // --- Merit totals ---
  const totalMerit = subjects.reduce((acc, s) => acc + (latestFor(s)?.merit || 0), 0);
  document.getElementById('meritNow').textContent = totalMerit.toFixed(1);

  document.getElementById('meritGoal').textContent = 300;
  document.getElementById('meritEst').textContent = (totalMerit + 40).toFixed(1);
</script>






</body>
</html>
